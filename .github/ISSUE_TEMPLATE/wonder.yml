name: "🌱 Plant a wonder"
description: Ask a bedtime question without pretending it is already an answer.
title: "[Wonder] "
body:
  - type: markdown
    attributes:
      value: |
        ## Wonder first

        Small questions can become big dreams. Uncertainty does not have to be failure.

        **Grown-ups:** Please post for young children. Do not include a child's name, face, location, school, or other personal details.
  - type: textarea
    id: wonder
    attributes:
      label: What do you wonder?
      placeholder: "I wonder whether..."
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: What have you noticed so far?
      placeholder: "So far, I noticed..."
  - type: dropdown
    id: next
    attributes:
      label: What could help next?
      options:
        - "Another observer"
        - "A closer look"
        - "A view from farther away"
        - "Another picture"
        - "More time"
        - "A small experiment"
        - "I do not know yet"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Gentle posting promise
      options:
        - label: "I am an adult or eligible account holder, and I will not post a child's personal information."
          required: true
